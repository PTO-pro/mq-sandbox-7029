name: ci
on:
  pull_request:
  merge_group:
    types: [checks_requested]
jobs:
  ok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on a queue run when EJECT exists (forced-ejection fixture)
        run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref }} sha=${{ github.sha }}"
          git log --format='%H %P %s' -3
          if [ "${{ github.event_name }}" = merge_group ] && [ -f EJECT ]; then echo "EJECT present"; exit 1; fi
